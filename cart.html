<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart & Checkout — Pratikal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="admin-bar" id="adminBar">You are admin — <a href="admin/index.html">Admin</a></div>
<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">Prati<em>kal</em></a>
    <nav class="nav-links">
      <a href="shop.html">Shop</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="profile.html">Account</a>
    </nav>
    <div class="nav-icons">
      <span class="user-chip" id="userChip" style="display:none"></span>
      <a class="icon-btn" href="profile.html">👤</a>
      <a class="icon-btn" href="cart.html">🛒<span class="cart-badge">0</span></a>
      <button class="hamburger" id="menuBtn" type="button"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="shop.html">Shop</a>
    <a href="profile.html">Account</a>
    <a href="cart.html">Cart</a>
  </div>
</header>

<div class="page-head cream">
  <h1>Your cart</h1>
  <p>Review items · Enter delivery details · Pay securely</p>
</div>

<div class="cart-layout" id="cartRoot"></div>

<a class="floating-wa" href="https://wa.me/2347053326235" target="_blank" rel="noopener" title="WhatsApp">💬</a>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
function renderAll() {
  var cart = Store.getCart();
  var root = document.getElementById('cartRoot');
  if (!cart.length) {
    root.innerHTML =
      '<div class="cart-panel" style="grid-column:1/-1;text-align:center;padding:60px 24px;">' +
      '<div style="font-size:2.5rem;margin-bottom:12px;">🛒</div>' +
      '<p style="font-size:1.15rem;margin-bottom:8px;">Your cart is empty.</p>' +
      '<p style="color:var(--muted);margin-bottom:20px;">Browse the shop and add products.</p>' +
      '<a class="btn btn-accent" href="shop.html">Browse the collection</a></div>';
    return;
  }

  var total = cart.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
  var user = Store.getUser();

  var itemsHtml = cart.map(function (i) {
    var img = i.image
      ? '<img src="' + Store.escapeHtml(i.image) + '" alt="">'
      : '<div class="ph-sm">▣</div>';
    return (
      '<div class="cart-item">' + img +
      '<div style="flex:1">' +
        '<strong>' + Store.escapeHtml(i.name) + '</strong><br>' +
        '<span style="color:var(--muted)">' + Store.money(i.price) + ' each</span>' +
        '<div class="qty-wrap">' +
          '<button type="button" class="qty-minus" data-id="' + Store.escapeHtml(i.id) + '">−</button>' +
          '<span>' + i.qty + '</span>' +
          '<button type="button" class="qty-plus" data-id="' + Store.escapeHtml(i.id) + '">+</button>' +
        '</div>' +
        '<button type="button" class="rm" data-id="' + Store.escapeHtml(i.id) + '" style="background:none;border:none;color:var(--danger);cursor:pointer;margin-top:8px;font-size:0.85rem;">Remove</button>' +
      '</div>' +
      '<div class="price">' + Store.money(i.price * i.qty) + '</div></div>'
    );
  }).join('');

  var emailDefault = user ? user.email : '';

  root.innerHTML =
    '<div class="cart-panel">' +
      '<h2 style="font-family:Syne,sans-serif;font-size:1.2rem;margin-bottom:16px;">Items (' + cart.length + ')</h2>' +
      itemsHtml +
      '<div class="cart-total-row"><span>Subtotal</span><span class="price">' + Store.money(total) + '</span></div>' +
    '</div>' +
    '<div class="checkout-panel">' +
      '<div class="checkout-steps"><span class="active">1. Details</span><span>→</span><span>2. Paystack</span></div>' +
      '<h2>Delivery & payment</h2>' +
      '<div class="form-group"><label>Full name *</label><input type="text" id="cName" placeholder="As on delivery" required></div>' +
      '<div class="form-group"><label>Email *</label><input type="email" id="cEmail" value="' + Store.escapeHtml(emailDefault) + '" placeholder="you@email.com" required></div>' +
      '<div class="form-group"><label>Phone *</label><input type="tel" id="cPhone" placeholder="080..." required></div>' +
      '<div class="form-group"><label>Street address *</label><input type="text" id="cStreet" placeholder="House no, street name" required></div>' +
      '<div class="form-row two">' +
        '<div class="form-group"><label>City *</label><input type="text" id="cCity" placeholder="e.g. Lagos" required></div>' +
        '<div class="form-group"><label>State *</label><input type="text" id="cState" placeholder="e.g. Lagos State" required></div>' +
      '</div>' +
      '<div class="form-group"><label>Landmark / extra note (optional)</label><input type="text" id="cNote" placeholder="Near bus stop, gate colour..."></div>' +
      '<div class="cart-total-row" style="margin-top:8px;"><span>Total</span><span class="price">' + Store.money(total) + '</span></div>' +
      '<button type="button" class="btn btn-accent btn-block" id="payBtn">Pay ' + Store.money(total) + ' with Paystack</button>' +
      '<a class="btn btn-outline btn-block" style="margin-top:10px;" id="waOrder" href="#">Order on WhatsApp instead</a>' +
      '<p class="secure-note">🔒 Card payment secured by Paystack · Full address required for delivery</p>' +
    '</div>';

  root.querySelectorAll('.rm').forEach(function (btn) {
    btn.addEventListener('click', function () {
      Store.setCart(Store.getCart().filter(function (c) { return c.id !== btn.getAttribute('data-id'); }));
      renderAll();
    });
  });
  root.querySelectorAll('.qty-plus').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-id');
      var item = Store.getCart().find(function (c) { return c.id === id; });
      if (item) Store.setQty(id, item.qty + 1);
      renderAll();
    });
  });
  root.querySelectorAll('.qty-minus').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-id');
      var item = Store.getCart().find(function (c) { return c.id === id; });
      if (item && item.qty > 1) Store.setQty(id, item.qty - 1);
      renderAll();
    });
  });

  document.getElementById('waOrder').addEventListener('click', function (e) {
    e.preventDefault();
    var name = (document.getElementById('cName').value || '').trim();
    var phone = (document.getElementById('cPhone').value || '').trim();
    var street = (document.getElementById('cStreet').value || '').trim();
    var city = (document.getElementById('cCity').value || '').trim();
    var state = (document.getElementById('cState').value || '').trim();
    var lines = Store.getCart().map(function (i) { return i.qty + 'x ' + i.name + ' (' + Store.money(i.price * i.qty) + ')'; });
    var msg = 'Hi Pratikal, I want to order:\n' + lines.join('\n') +
      '\nTotal: ' + Store.money(total) +
      '\nName: ' + name +
      '\nPhone: ' + phone +
      '\nAddress: ' + street + ', ' + city + ', ' + state;
    window.open('https://wa.me/' + APP.whatsapp + '?text=' + encodeURIComponent(msg), '_blank');
  });

  document.getElementById('payBtn').addEventListener('click', function () {
    var name = document.getElementById('cName').value.trim();
    var email = document.getElementById('cEmail').value.trim();
    var phone = document.getElementById('cPhone').value.trim();
    var street = document.getElementById('cStreet').value.trim();
    var city = document.getElementById('cCity').value.trim();
    var state = document.getElementById('cState').value.trim();
    var note = document.getElementById('cNote').value.trim();
    if (!name || !email || !phone || !street || !city || !state) {
      Store.toast('Please fill all required fields including full address');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      Store.toast('Enter a valid email');
      return;
    }
    var fullAddress = street + ', ' + city + ', ' + state + (note ? ' (' + note + ')' : '');
    Store.payWithPaystack({
      email: email,
      amount: total,
      name: name,
      phone: phone,
      street: street,
      city: city,
      state: state,
      fullAddress: fullAddress
    });
  });
}

Store.init({ onReady: renderAll });
</script>
</body>
</html>
