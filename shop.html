        <option value="new">Newest</option>

        <option value="price-desc">Price: high to low</option>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
var currentCat = 'all';
var sortMode = 'new';

function sortedFiltered() {
  var list = Store.getProducts().slice();
  if (currentCat !== 'all') {
    list = list.filter(function (p) { return (p.category || 'General') === currentCat; });
  }
  if (sortMode === 'price-asc') list.sort(function (a, b) { return (a.price || 0) - (b.price || 0); });
  else if (sortMode === 'price-desc') list.sort(function (a, b) { return (b.price || 0) - (a.price || 0); });
  else if (sortMode === 'name') list.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
  return list;
}

function buildSide(list) {
  var cats = {};
  Store.getProducts().forEach(function (p) {
    var c = (p.category || 'General').trim();
    if (c) cats[c] = (cats[c] || 0) + 1;
  });
  var html = '<button type="button" class="side-cat' + (currentCat === 'all' ? ' active' : '') + '" data-cat="all">All categories</button>';
  Object.keys(cats).sort().forEach(function (c) {
    html += '<button type="button" class="side-cat' + (currentCat === c ? ' active' : '') + '" data-cat="' + Store.escapeHtml(c) + '">' +
      Store.escapeHtml(c) + ' <span style="opacity:0.5">(' + cats[c] + ')</span></button>';
  });
  var el = document.getElementById('sideCats');
  el.innerHTML = html;
  el.querySelectorAll('.side-cat').forEach(function (btn) {
    btn.addEventListener('click', function () {
      currentCat = btn.getAttribute('data-cat');
      paint();
    });
  });
}

function paint() {
  var list = sortedFiltered();
  buildSide(list);
  document.getElementById('productCount').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');
  Store.renderProductGrid(document.getElementById('shopGrid'), list);
}

document.getElementById('sortSelect').addEventListener('change', function () {
  sortMode = this.value;
  paint();
});

Store.init({ loadProducts: true, onProducts: function () { paint(); } });
</script>
</body>
</html>
