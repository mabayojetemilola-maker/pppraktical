<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Pratikal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">Prati<em>kal</em></a>
    <div class="nav-icons">
      <a class="icon-btn" href="cart.html">🛒<span class="cart-badge">0</span></a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div id="loggedOut">
      <h1 id="formTitle">Sign in</h1>
      <p class="hint">Login only needed for checkout or admin. Shop freely without an account.</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn btn-accent btn-block" type="button" id="submitBtn">Sign in</button>
      <p class="error-msg" id="err"></p>
      <p class="auth-switch" id="switchLine">No account? <a href="#" id="switchMode">Create one</a></p>
    </div>
    <div id="loggedIn" style="display:none;">
      <h1>Your account</h1>
      <p class="hint" id="userInfo"></p>
      <a class="btn btn-accent btn-block" id="adminLink" href="admin/index.html" style="display:none;margin-bottom:10px;">Open admin panel</a>
      <a class="btn btn-outline btn-block" href="cart.html" style="margin-bottom:10px;">Go to cart</a>
      <button class="btn btn-outline btn-block" type="button" id="logoutBtn">Log out</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
var mode = 'login';
var params = new URLSearchParams(location.search);
var next = params.get('next') || 'index.html';

function setMode(m) {
  mode = m;
  document.getElementById('formTitle').textContent = m === 'login' ? 'Sign in' : 'Create account';
  document.getElementById('submitBtn').textContent = m === 'login' ? 'Sign in' : 'Register';
  document.getElementById('switchLine').innerHTML = m === 'login'
    ? 'No account? <a href="#" id="switchMode">Create one</a>'
    : 'Have an account? <a href="#" id="switchMode">Sign in</a>';
  document.getElementById('switchMode').onclick = function (e) {
    e.preventDefault();
    setMode(mode === 'login' ? 'register' : 'login');
  };
}
setMode('login');

Store.init({
  onReady: function () {
    var u = Store.getUser();
    if (u) {
      document.getElementById('loggedOut').style.display = 'none';
      document.getElementById('loggedIn').style.display = 'block';
      document.getElementById('userInfo').innerHTML = 'Signed in as <strong>' + Store.escapeHtml(u.email) + '</strong>' +
        (Store.getIsAdmin() ? '<br><span style="color:var(--accent)">Admin access</span>' : '');
      if (Store.getIsAdmin()) document.getElementById('adminLink').style.display = 'block';
    }
  }
});

document.getElementById('submitBtn').addEventListener('click', function () {
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('password').value;
  var err = document.getElementById('err');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Enter email and password'; return; }
  var p = mode === 'login' ? Store.login(email, pass) : Store.register(email, pass);
  p.then(function () {
    Store.toast(mode === 'login' ? 'Signed in' : 'Account created');
    setTimeout(function () { location.href = next; }, 500);
  }).catch(function (e) {
    err.textContent = e.message || 'Failed';
  });
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  Store.logout().then(function () { location.reload(); });
});
</script>
</body>
</html>
